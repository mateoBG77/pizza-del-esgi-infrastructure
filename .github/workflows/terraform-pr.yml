name: terraform-pr
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    concurrency:
      group: tfstate-${{ matrix.env }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: envs/${{ matrix.env }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_db_password: ${{ matrix.env == 'prod' && secrets.DB_PASSWORD_PROD || secrets.DB_PASSWORD_DEV }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: fmt
        id: fmt
        working-directory: .
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: init
        run: terraform init -input=false

      - name: validate
        id: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: terraform plan -input=false -no-color -lock-timeout=120s 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Poster le plan en commentaire
        if: always()
        uses: actions/github-script@v9
        env:
          ENV_NAME: ${{ matrix.env }}
          FMT: ${{ steps.fmt.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const file = `envs/${process.env.ENV_NAME}/plan.txt`;
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(aucun plan produit)';
            const body = [
              `### Terraform : ${process.env.ENV_NAME}`,
              `fmt : ${process.env.FMT} · validate : ${process.env.VALIDATE} · plan : ${process.env.PLAN}`,
              '<details><summary>Plan complet</summary>',
              '',
              '```',
              plan.slice(-60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Statut final
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "::error::fmt ou plan en échec sur ${{ matrix.env }} (voir le commentaire de la PR)"
          exit 1
